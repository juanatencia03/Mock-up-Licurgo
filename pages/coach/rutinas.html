<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel Coach - Asignar Rutinas</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../css/styles.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
      <div class="container-fluid px-3">
        <a
          class="navbar-brand d-flex align-items-center"
          href="../../index.html"
          title="Volver al Selector"
        >
          <i class="bi bi-shield-shaded text-warning fs-4 me-2"></i>
          <span class="brand-title">LICURGO</span>
          <span class="brand-badge bg-warning text-dark">COACH</span>
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navCoach"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navCoach">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link active" href="rutinas.html"
                ><i class="bi bi-pencil-square me-1"></i> Asignar Rutinas
                (CU09)</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="observaciones.html"
                ><i class="bi bi-card-text me-1"></i> Ficha Técnica /
                Observaciones (CU10)</a
              >
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container py-4">
      <div class="row g-4">
        <!-- Selector de Alumno -->
        <div class="col-12 col-md-4">
          <div class="custom-card p-3">
            <h5 class="text-light fw-bold mb-3">
              <i class="bi bi-people me-2 text-warning"></i>Alumnos Asignados
            </h5>
            <div class="list-group list-group-flush bg-transparent">
              <button
                class="list-group-item list-group-item-action bg-transparent text-light border-secondary active"
              >
                <strong>Juan Perez</strong><br /><small class="text-secondary"
                  >Nivel: Intermedio</small
                >
              </button>
              <button
                class="list-group-item list-group-item-action bg-transparent text-light border-secondary"
              >
                <strong>Agostina Diaz</strong><br /><small
                  class="text-secondary"
                  >Nivel: Inicial</small
                >
              </button>
              <button
                class="list-group-item list-group-item-action bg-transparent text-light border-secondary"
              >
                <strong>Federico Gomez</strong><br /><small
                  class="text-secondary"
                  >Nivel: Avanzado</small
                >
              </button>
            </div>
          </div>
        </div>

        <!-- Constructor de Rutina -->
        <div class="col-12 col-md-8">
          <div class="custom-card p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h4 class="h5 text-light fw-bold mb-0">
                Estructurar Rutina: Juan Perez
              </h4>
              <span class="badge text-bg-warning">CU09</span>
            </div>

            <form>
              <div class="mb-3">
                <label class="form-label text-secondary small"
                  >Día o Bloque</label
                >
                <input
                  type="text"
                  class="form-control bg-dark text-light border-secondary"
                  value="Jueves - Empuje y Core"
                />
              </div>

              <!-- Ejercicios Dinámicos -->
              <label class="form-label text-secondary small"
                >Ejercicios de la Sesión</label
              >
              <div class="row g-2 mb-2">
                <div class="col-7">
                  <input
                    type="text"
                    class="form-control bg-dark text-light border-secondary"
                    placeholder="Ejercicio"
                    value="Fondos en paralelas"
                  />
                </div>
                <div class="col-3">
                  <input
                    type="text"
                    class="form-control bg-dark text-light border-secondary"
                    placeholder="Series x Reps"
                    value="4x8"
                  />
                </div>
                <div class="col-2">
                  <button type="button" class="btn btn-outline-danger w-100">
                    <i class="bi bi-trash"></i>
                  </button>
                </div>
              </div>

              <div class="row g-2 mb-3">
                <div class="col-7">
                  <input
                    type="text"
                    class="form-control bg-dark text-light border-secondary"
                    placeholder="Ejercicio"
                    value="Tuck Planche Sostén"
                  />
                </div>
                <div class="col-3">
                  <input
                    type="text"
                    class="form-control bg-dark text-light border-secondary"
                    placeholder="Series x Reps"
                    value="5x10s"
                  />
                </div>
                <div class="col-2">
                  <button type="button" class="btn btn-outline-danger w-100">
                    <i class="bi bi-trash"></i>
                  </button>
                </div>
              </div>

              <button
                type="button"
                class="btn btn-sm btn-outline-secondary text-light mb-4"
              >
                <i class="bi bi-plus-circle me-1"></i> Agregar otro ejercicio
              </button>

              <button type="button" class="btn btn-gold w-100 py-2">
                <i class="bi bi-floppy me-2"></i> Guardar y Asignar Rutina
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
